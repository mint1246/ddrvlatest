ddrv:
  token: your_token_here
  token_type: 0 # (0 - Bot, 1 - User, 2 - Nitro User, 3 - Basic Nitro User)
  channels:
    - channel1
    - channel2

dataprovider:
  boltdb:
    db_path: ./ddrv.db
  postgres:
    db_url: postgres://user:password@localhost:port/database?sslmode=disable

frontend:
  ftp:
    addr: ":2525"
    username: username
    password: password
    async_write: false
  http:
    upload_session_size_limit: 107374182400
    upload_user_quota: 1099511627776
    upload_concurrent_transfers: 4
    upload_requests_per_minute: 240
    upload_memory_limit: 26214400
    addr: ":2526"
    username: username
    password_hash: "$argon2id$v=19$m=19456,t=2,p=1$<salt>$<hash>"
    jwt_secret_file: /run/secrets/ddrv_jwt
    access_token_ttl_seconds: 900
    guest_mode: true
    async_write: false
